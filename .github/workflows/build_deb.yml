name: Build clangg Tweak & Deploy Sileo / Cydia APT Repo

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install ldid and dpkg tools
        run: |
          brew install ldid dpkg

      - name: Setup Theos & iOS SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          mv sdks-master/*.sdk ~/theos/sdks/
          rm -rf master.zip sdks-master

      - name: Build Rootless DEB (Dopamine / Palera1n Rootless)
        run: |
          export THEOS=~/theos
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload Compiled DEB Packages
        uses: actions/upload-artifact@v4
        with:
          name: clangg_Rootless_DEB
          path: packages/*.deb

      - name: Generate Sileo & Cydia APT Repository
        run: |
          mkdir -p repo/debs
          cp packages/*.deb repo/debs/
          cd repo
          
          # Create Release file for Sileo / Cydia
          cat << 'EOF' > Release
          Origin: clangg
          Label: clangg
          Suite: stable
          Version: 1.2.7
          Codename: ios
          Architectures: iphoneos-arm64 iphoneos-arm64e
          Components: main
          Description: clangg
          EOF

          # Create Packages and Packages.bz2
          dpkg-scanpackages -m debs /dev/null > Packages
          bzip2 -k -f Packages
          gzip -c Packages > Packages.gz
          
          # Create clean index.html for Repo
          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>clangg Repo</title>
              <style>
                  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b0f19; color: #fff; text-align: center; padding: 40px 20px; }
                  .card { max-width: 480px; margin: 0 auto; background: #111827; padding: 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
                  h1 { font-size: 1.5rem; color: #818CF8; margin-bottom: 10px; }
                  p { color: #9CA3AF; line-height: 1.5; }
                  .btn { display: inline-block; padding: 12px 24px; border-radius: 12px; background: #4F46E5; color: #fff; text-decoration: none; font-weight: 600; margin-top: 15px; }
                  .btn:hover { background: #4338CA; }
                  code { background: #000; padding: 6px 12px; border-radius: 8px; font-family: monospace; color: #38BDF8; display: inline-block; margin-top: 8px; }
              </style>
          </head>
          <body>
              <div class="card">
                  <h1>clangg Repo</h1>
                  <a href="sileo://source/https://kongnenhaaa.github.io/seb/" class="btn">Thêm Vào Sileo</a>
                  <div style="margin-top: 25px;">
                      <p style="font-size: 0.85rem;">Thêm nguồn thủ công:</p>
                      <code>https://kongnenhaaa.github.io/seb/</code>
                  </div>
              </div>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './repo'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
